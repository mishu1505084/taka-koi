<style>
/* Layout: one phone-width column; sticky month header, envelope list, fixed bottom tab bar, bottom sheets for every edit. */
:root{
  --bg:#F4F5FB; --surface:#FFFFFF; --sunk:#ECEEF7; --ink:#151933; --muted:#646B88; --line:#E3E6F1;
  --accent:#5046E5; --accent-ink:#FFFFFF; --accent-2:#9B5CF6; --hi:#FFB547; --hi-ink:#3D2600; --hi-soft:#FFF3DE;
  --good:#0E9F76; --good-soft:#DDF6EE; --warn:#C7790A; --warn-soft:#FDEFD6; --bad:#E0464F; --bad-soft:#FDE4E5;
  --shadow:0 12px 32px rgba(32,36,90,.14); --lift:0 1px 2px rgba(32,36,90,.05),0 4px 14px rgba(32,36,90,.06);
  --f-display:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Manrope",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0F1F; --surface:#161931; --sunk:#1F2340; --ink:#E9EBF8; --muted:#9BA1C2; --line:#292E4F;
  --accent:#8B84FF; --accent-ink:#0D0F1F; --accent-2:#C084FC; --hi:#FFC266; --hi-ink:#2E1C00; --hi-soft:#33291A;
  --good:#3DD6A3; --good-soft:#123329; --warn:#F2B04A; --warn-soft:#382A12; --bad:#FF6B73; --bad-soft:#3E1C22;
  --shadow:0 12px 32px rgba(0,0,0,.55); --lift:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F1F; --surface:#161931; --sunk:#1F2340; --ink:#E9EBF8; --muted:#9BA1C2; --line:#292E4F;
  --accent:#8B84FF; --accent-ink:#0D0F1F; --accent-2:#C084FC; --hi:#FFC266; --hi-ink:#2E1C00; --hi-soft:#33291A;
  --good:#3DD6A3; --good-soft:#123329; --warn:#F2B04A; --warn-soft:#382A12; --bad:#FF6B73; --bad-soft:#3E1C22;
  --shadow:0 12px 32px rgba(0,0,0,.55); --lift:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-right:auto;white-space:nowrap}
.brand svg{width:26px;height:26px;flex:none}
.brand em{font-style:normal;color:var(--accent)}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
.month button:hover{background:var(--sunk)}
.month span{font-weight:600;min-width:84px;text-align:center;font-size:14px}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok b{background:var(--good)} .sync.busy b{background:var(--hi)} .sync.err b{background:var(--bad)}

/* ready to assign */
.rta{border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--surface);border:1px solid var(--line)}
.rta.pos{background:var(--hi);color:var(--hi-ink);border-color:transparent}
.rta.neg{background:var(--bad);color:#fff;border-color:transparent}
.rta .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;opacity:.8}
.rta strong{display:block;font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1.05}
.rta .sub{font-size:13px;opacity:.85}
.rta .go{border:0;border-radius:12px;padding:10px 12px;font-weight:600;font-size:13px;background:rgba(0,0,0,.12);color:inherit;text-align:center;max-width:150px}
.rta:not(.pos):not(.neg) .go{background:var(--sunk)}
.rta .go:disabled{opacity:.45;cursor:default}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;flex:1 1 90px;min-width:0}
.chip .num{color:var(--ink);font-size:14px;font-weight:600}

.banner{margin:4px 0 12px;padding:12px 14px;border-radius:14px;background:var(--hi-soft);border:1px dashed var(--warn);font-size:14px;display:grid;gap:10px}
.banner .row{display:flex;gap:8px;flex-wrap:wrap}
.notice{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:13px;font-weight:500}

/* groups */
.group{margin-top:18px}
.ghead{display:flex;align-items:center;gap:8px;padding:6px 4px;border:0;background:none;width:100%;text-align:left}
.ghead h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.ghead .caret{transition:transform .15s;color:var(--muted);font-size:12px}
.group.closed .caret{transform:rotate(-90deg)}
.ghead .num{font-size:12px;color:var(--muted)}
.cats{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.group.closed .cats{display:none}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;width:100%;text-align:left;padding:11px 14px;border:0;background:none;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat:hover{background:var(--sunk)}
.cat .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .hint{font-size:12px;color:var(--muted);grid-column:1}
.cat .hint.warn{color:var(--warn)} .cat .hint.bad{color:var(--bad)} .cat .hint.good{color:var(--good)}
.cat .right{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px;justify-content:center}
.cat .asg{font-size:11px;color:var(--muted)}
.bar{grid-column:1;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.pill{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad);color:#fff}

/* lists */
h2.sec{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:22px 4px 8px;font-weight:700}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.li:first-child{border-top:0}
button.li:hover{background:var(--sunk)}
.li .main{flex:1;min-width:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .amt{font-weight:600}
.amt.in{color:var(--good)} .amt.neg{color:var(--bad)}
.ico{width:34px;height:34px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none;font-family:var(--f-display)}
.daterow{font-size:12px;color:var(--muted);font-weight:600;padding:12px 4px 6px;text-transform:uppercase;letter-spacing:.06em}
.clr{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;padding:0;display:grid;place-items:center;font-size:11px;color:var(--accent-ink)}
.clr.on{background:var(--accent);border-color:var(--accent)}
.clr.lock{background:var(--muted);border-color:var(--muted)}
.acct-hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:4px}
.acct-hero .big{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.03em}
.acct-hero .row{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.search{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;margin-top:2px}

/* buttons & forms */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.field{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);width:100%;min-width:0}
.field textarea{font-family:var(--f-num);font-size:12px;min-height:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amount-in{font-family:var(--f-display)!important;font-size:34px!important;font-weight:800;text-align:center;letter-spacing:-.02em}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600}
.quick button:hover{border-color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:500}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--sunk);border-radius:14px;padding:10px}
.kv div{display:flex;flex-direction:column;font-size:11px;color:var(--muted);min-width:0}
.kv .num{font-size:13px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:var(--shadow);display:grid;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0}
.sheet h2{margin:0;font-family:var(--f-display);font-size:22px;letter-spacing:-.02em;text-wrap:balance}
.sheet .shead{display:flex;align-items:center;gap:10px}
.sheet .shead h2{flex:1}
.x{border:0;background:var(--sunk);width:32px;height:32px;border-radius:50%;font-size:16px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--bad)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 0;white-space:nowrap;letter-spacing:-.01em;min-width:0}
.tabs button.on{color:var(--accent)}
.tabs svg{width:22px;height:22px}
.tabs .add{justify-self:center;width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:var(--shadow)}
.tabs .add svg{width:26px;height:26px}

/* reports */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{margin:0 0 2px;font-family:var(--f-display);font-size:17px}
.card .cap{font-size:12px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;margin-top:12px;font-size:13px}
.hbar .track{grid-column:1/3;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-num)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.person{margin-top:14px}
.person .ph{display:flex;align-items:center;gap:10px;padding:4px 4px 8px}
.person .ph h3{margin:0;margin-right:auto;font-family:var(--f-display);font-size:17px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iou{display:grid;grid-template-columns:1fr auto;gap:3px 10px;width:100%;text-align:left;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none}
.iou:first-child{border-top:0}
.iou:hover{background:var(--sunk)}
.iou .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iou .s{font-size:12px;color:var(--muted);grid-column:1}
.iou .s.bad{color:var(--bad);font-weight:600}
.iou .r{grid-row:1/3;grid-column:2;text-align:right;display:flex;flex-direction:column;justify-content:center}
.iou .r small{font-size:11px;color:var(--muted)}
.iou .bar{grid-column:1/3}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;margin-right:6px;vertical-align:1px}
.tag.lent{background:var(--good-soft);color:var(--good)} .tag.borrowed{background:var(--bad-soft);color:var(--bad)}
.tag.fix{background:var(--warn-soft);color:var(--warn);margin:0 6px 0 0}
.mv{flex:none;width:28px;height:30px;border:0;border-radius:8px;background:var(--sunk);color:var(--muted);font-size:13px;padding:0;display:grid;place-items:center}
.mv:disabled{opacity:.3;cursor:default}
.mv:not(:disabled):hover{color:var(--accent)}
.sorthead{display:flex;align-items:center;gap:8px;margin:22px 4px 8px}
.sorthead h2.sec{margin:0;margin-right:auto}
.ib{border:0;background:var(--sunk);border-radius:8px;padding:6px 8px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.ib.del{color:var(--bad)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}

.mgr-row{display:flex;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.mgr-row:first-child{border-top:0}
.mgr-row input{flex:1;min-width:0;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px;font-size:14px}
.mgr-row input:hover,.mgr-row input:focus{border-color:var(--line);background:var(--bg)}
.emo{flex:none;width:34px;height:34px;border-radius:10px;border:1px dashed var(--line);background:var(--bg);font-size:18px;line-height:1;display:grid;place-items:center;color:var(--muted);padding:0}
.emo:hover{border-color:var(--accent)}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.emogrid button{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:22px;padding:0}
.emogrid button:hover,.emogrid button.on{border-color:var(--accent);background:var(--sunk)}
.menu{flex:none;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);position:relative;padding:0}
.menu svg{width:20px;height:20px}
.menu.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = () => Math.random().toString(36).slice(2, 10);
const z2 = n => String(n).padStart(2, "0");
const localISO = d => d.getFullYear() + "-" + z2(d.getMonth() + 1) + "-" + z2(d.getDate());
const TODAY = localISO(new Date());
const CUR = TODAY.slice(0, 7);
const ymOf = d => d.slice(0, 7);
function addM(ym, n) { let [y, m] = ym.split("-").map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return y + "-" + z2(m); }
function mDiff(a, b) { const [y1, m1] = a.split("-").map(Number), [y2, m2] = b.split("-").map(Number); return (y2 - y1) * 12 + (m2 - m1); }
const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const mLabel = ym => MN[+ym.slice(5) - 1] + " " + ym.slice(0, 4);
const mShort = ym => MN[+ym.slice(5) - 1];
const dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
function dLabel(d) {
  if (d === TODAY) return "Today";
  const y = localISO(new Date(Date.now() - 864e5)); if (d === y) return "Yesterday";
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: d.slice(0,4) !== TODAY.slice(0,4) ? "numeric" : undefined });
}
const CURRENCIES = [["৳","en-IN","Bangladeshi taka (৳)"],["₹","en-IN","Indian rupee (₹)"],["$","en-US","US dollar ($)"],["€","de-DE","Euro (€)"],["£","en-GB","Pound (£)"]];
function fmt(c, o = {}) {
  c = Math.round(c || 0);
  const neg = c < 0, a = Math.abs(c), frac = a % 100 !== 0;
  const s = new Intl.NumberFormat(S.meta.locale || "en-IN", { minimumFractionDigits: frac ? 2 : 0, maximumFractionDigits: 2 }).format(a / 100);
  return (neg ? "−" : (o.sign && c > 0 ? "+" : "")) + S.meta.currency + s;
}
const plain = c => (Math.round(c || 0) / 100).toString();
function parseAmt(str) {
  str = String(str ?? "").replace(/[,\s৳$€£₹]/g, "").replace(/−/g, "-");
  if (!str) return null;
  if (!/^[-+]?[\d.]+([-+][\d.]+)*$/.test(str)) return null;
  let t = 0; for (const p of str.match(/[-+]?[\d.]+/g)) { const n = parseFloat(p); if (isNaN(n)) return null; t += n; }
  return Math.round(t * 100);
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200); }
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

/* ---------- state ---------- */
let S = null;            // { meta, tx: { "YYYY-MM": [tx] } }
let mode = "example";    // example | live
let store = "pending";   // pending | db (Claude) | cloud (email login) | local
let syncState = "idle";  // idle | busy | err
const ui = { tab: "budget", accView: "accounts", tf: { acct: "", month: "", type: "" }, month: CUR, acct: null, report: "spending", q: "", limit: 150, collapsed: new Set(JSON.parse(lsGet("et-collapsed") || "[]")) };

function defaultGroups() {
  const g = (name, cats) => ({ id: rid(), name, cats: cats.map(c => ({ id: rid(), name: c[0], target: c[1] || null, hidden: false })) });
  return withEmoji([
    g("Bills", [["Rent"], ["Electricity & gas"], ["Internet"], ["Mobile"]]),
    g("Everyday", [["Groceries"], ["Dining out"], ["Transport"], ["Household"]]),
    g("Family", [["Family support"], ["Gifts & Eid"]]),
    g("Goals", [["Emergency fund"], ["Travel"]]),
    g("Lifestyle", [["Hobbies"], ["Subscriptions"], ["Clothing"]]),
  ]);
}
function blank() {
  return { meta: { v: 1, currency: "৳", locale: "en-IN", groups: defaultGroups(), accounts: [], assigned: {}, payees: {}, ious: [], incomeCats: defaultIncome(), showEmoji: true, work: { mode: "auto", rate: 0, hpd: 8, dpm: 22, budget: true, tx: false } }, tx: {} };
}

/* example budget: three months, clearly labelled in the UI */
function example() {
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const T = (amt) => ({ type: "monthly", amount: amt * 100 });
  const g = (name, cats) => ({ id: rid(), name, cats: cats.map(c => ({ id: rid(), name: c[0], target: c[1] || null, hidden: false })) });
  const groups = [
    g("Bills", [["Rent", T(22000)], ["Electricity & gas", T(3200)], ["Internet", T(1200)], ["Mobile", T(800)]]),
    g("Everyday", [["Groceries", T(12000)], ["Dining out", T(4000)], ["Transport", T(5000)], ["Household", T(2000)]]),
    g("Family", [["Family support", T(8000)], ["Gifts & Eid", { type: "by", amount: 1500000, date: addM(CUR, 5) }]]),
    g("Goals", [["Emergency fund", { type: "by", amount: 30000000, date: addM(CUR, 14) }], ["New laptop", { type: "by", amount: 12000000, date: addM(CUR, 8) }], ["Travel", null]]),
    g("Lifestyle", [["Hobbies", T(3000)], ["Subscriptions", T(900)], ["Clothing", null]]),
  ];
  withEmoji(groups);
  const C = {}; groups.forEach(gr => gr.cats.forEach(c => C[c.name] = c.id));
  const incomeCats = defaultIncome(); const IC = {}; incomeCats.forEach(c => IC[c.name] = c.id);
  const A = { bank: rid(), bkash: rid(), cash: rid(), card: rid(), inv: rid() };
  const accounts = [
    { id: A.bank, name: "Salary account", type: "checking", onBudget: true, closed: false },
    { id: A.bkash, name: "bKash", type: "wallet", onBudget: true, closed: false },
    { id: A.cash, name: "Cash wallet", type: "cash", onBudget: true, closed: false },
    { id: A.card, name: "Credit card", type: "credit", onBudget: true, closed: false },
    { id: A.inv, name: "Sanchayapatra", type: "investment", onBudget: false, closed: false },
  ];
  const tx = {}; const put = t => { (tx[ymOf(t.date)] ??= []).push({ id: rid(), memo: "", cleared: true, ...t }); };
  const m0 = addM(CUR, -2), m1 = addM(CUR, -1);
  put({ date: m0 + "-01", acct: A.bank, payee: "Starting balance", cat: "income", amount: 4500000 });
  put({ date: m0 + "-01", acct: A.cash, payee: "Starting balance", cat: "income", amount: 350000 });
  put({ date: m0 + "-01", acct: A.bkash, payee: "Starting balance", cat: "income", amount: 120000 });
  put({ date: m0 + "-01", acct: A.inv, payee: "Starting balance", cat: null, amount: 50000000 });
  const assigned = {};
  [m0, m1, CUR].forEach((m, i) => {
    const last = m === CUR ? +TODAY.slice(8) : 28;
    const day = d => m + "-" + z2(Math.min(d, last));
    const ok = d => d <= last;
    if (ok(1)) put({ date: day(1), acct: A.bank, payee: "Employer salary", cat: IC["Salary"], amount: 8500000 });
    if (ok(2)) put({ date: day(2), acct: A.bank, payee: "Landlord", cat: C["Rent"], amount: -2200000 });
    if (ok(3)) { const x = rid(); put({ date: day(3), acct: A.bank, payee: "Transfer: bKash", cat: null, amount: -1500000, xfer: A.bkash, xid: x }); put({ date: day(3), acct: A.bkash, payee: "Transfer: Salary account", cat: null, amount: 1500000, xfer: A.bank, xid: x }); }
    if (ok(5)) put({ date: day(5), acct: A.bkash, payee: "Family", cat: C["Family support"], amount: -800000 });
    if (ok(6)) put({ date: day(6), acct: A.bkash, payee: "DESCO prepaid", cat: C["Electricity & gas"], amount: -(260000 + Math.round(rnd() * 80) * 1000) });
    if (ok(7)) put({ date: day(7), acct: A.bkash, payee: "Link3 broadband", cat: C["Internet"], amount: -120000 });
    if (ok(8)) put({ date: day(8), acct: A.bkash, payee: "Grameenphone", cat: C["Mobile"], amount: -80000 });
    if (ok(10)) put({ date: day(10), acct: A.card, payee: "Streaming service", cat: C["Subscriptions"], amount: -90000 });
    const shops = [["Shwapno", "Groceries", A.card], ["Kacha bazar", "Groceries", A.cash], ["Pathao", "Transport", A.bkash], ["Uber", "Transport", A.card], ["Sultan's Dine", "Dining out", A.card], ["Coffee", "Dining out", A.cash], ["Daraz", "Household", A.card], ["Bookshop", "Hobbies", A.cash]];
    for (let d = 2; d <= last; d += 1 + Math.floor(rnd() * 2)) {
      const s = shops[Math.floor(rnd() * shops.length)];
      const base = { Groceries: 1400, Transport: 320, "Dining out": 750, Household: 900, Hobbies: 650 }[s[1]];

    }

    if (ok(25) && i < 2) { const x = rid(); put({ date: day(25), acct: A.bank, payee: "Transfer: Credit card", cat: null, amount: -1800000, xfer: A.card, xid: x }); put({ date: day(25), acct: A.card, payee: "Transfer: Salary account", cat: null, amount: 1800000, xfer: A.bank, xid: x }); }

    const a = assigned[m] = {};

    { id: rid(), kind: "lent", person: "Rahim", amount: 500000, date: m1 + "-12", due: addM(CUR, 1) + "-10", note: "Bike repair", acct: null, closed: false, payments: [{ id: rid(), date: CUR + "-05", amount: 200000 }] },
    { id: rid(), kind: "lent", person: "Office colleague", amount: 150000, date: m0 + "-20", due: m1 + "-15", note: "Lunch and cab", acct: null, closed: false, payments: [] },

    { id: rid(), kind: "lent", person: "Rahim", amount: 100000, date: m0 + "-03", due: null, note: "Cricket match tickets", acct: null, closed: false, payments: [{ id: rid(), date: m0 + "-28", amount: 100000 }] },

const catById = id => allCats().find(c => c.id === id);

        <label class="field">${e.kind === "lent" ? "Received into" : "Paid from"}<select id="p-acct"><option value="">Don't record in an account</option>${acctOpts(e.acct, a => !a.helper)}</select></label>
        <button class="btn pri block" data-pay>Record repayment</button></div>` : `<p class="notice" style="background:var(--good-soft);color:var(--good)">Settled.</p>`}
      ${(e.payments || []).length ? `<h3 style="margin:0;font-size:15px;font-family:var(--f-display)">Repayments</h3><div class="list">${e.payments.slice().sort((a, b) => a.date < b.date ? 1 : -1).map(p => `<div class="li"><span class="main"><span class="t" style="display:block">${dLabel(p.date)}</span></span><span class="amt num in">${fmt(p.amount)}</span><button class="ib del" data-unpay="${p.id}">Remove</button></div>`).join("")}</div>` : ""}
      <div class="grid2"><label class="field">${e.kind === "lent" ? "Lent to" : "Borrowed from"}<input id="e-person" value="${esc(e.person)}"></label><label class="field">Amount<input id="e-amt" class="num" inputmode="decimal" value="${plain(e.amount)}"></label></div>
      <div class="grid2"><label class="field">Date<input id="e-date" type="date" value="${e.date}"></label><label class="field">Due by<input id="e-due" type="date" value="${e.due || ""}"></label></div>
      <div class="grid2" style="grid-template-columns:1fr"><label class="field">What for<input id="e-note" value="${esc(e.note || "")}"></label></div>
      <button class="btn block" data-esave>Save details</button>
      <button class="btn block" data-settle>${open ? "Mark as settled" : "Reopen"}</button>
      <div id="idel"><button class="btn danger block" data-idel>Delete record</button></div>
      <p class="small muted">Changing the amount, removing a repayment or deleting a record doesn't change account transactions it created. Edit those under Transactions.</p>`;
  };
  const redraw = () => { const el = $("#sheetRoot .sheet"); if (!el) return; el.innerHTML = '<div class="grab"></div>' + draw(); };
  openSheet(draw(), el => {
    el.addEventListener("click", ev => {
      const q = ev.target.closest("[data-pq]"); if (q) { el.querySelector("#p-amt").value = plain(+q.dataset.pq); return; }
      if (ev.target.closest("[data-pay]")) {
        const amt = parseAmt(el.querySelector("#p-amt").value); if (!amt || amt <= 0) { toast("Enter the amount repaid."); return; }
        const left = iouLeft(e); if (amt > left) { toast(`That's more than the ${fmt(left)} remaining.`); return; }
        const date = el.querySelector("#p-date").value || TODAY, acct = el.querySelector("#p-acct").value || null;
        (e.payments ||= []).push({ id: rid(), date, amount: amt });
        const keys = ["meta"];
        if (acct) keys.push(...iouMove(acct, e.kind, amt, date, (e.kind === "lent" ? "Repaid by " : "Repaid to ") + e.person, e.kind === "borrowed"));
        markDirty(...new Set(keys)); render(); redraw(); toast(iouLeft(e) <= 0 ? "Fully repaid and settled" : `Recorded ${fmt(amt)}`); return;
      }
      const up = ev.target.closest("[data-unpay]"); if (up) { e.payments = e.payments.filter(p => p.id !== up.dataset.unpay); markDirty("meta"); render(); redraw(); toast("Repayment removed"); return; }
      if (ev.target.closest("[data-esave]")) {
        const person = el.querySelector("#e-person").value.trim(), amt = parseAmt(el.querySelector("#e-amt").value);
        if (!person) { toast("Add the person's name."); return; }
        if (!amt || amt <= 0) { toast("Enter an amount above zero."); return; }
        if (amt < iouPaid(e)) { toast(`Amount can't be less than the ${fmt(iouPaid(e))} already repaid.`); return; }
        e.person = person; e.amount = amt; e.date = el.querySelector("#e-date").value || e.date;
        e.due = el.querySelector("#e-due").value || null; e.note = el.querySelector("#e-note").value.trim();
        markDirty("meta"); render(); redraw(); toast("Saved"); return;
      }
      if (ev.target.closest("[data-settle]")) { e.closed = iouOpen(e); markDirty("meta"); render(); redraw(); toast(e.closed ? "Marked as settled" : "Reopened"); return; }
      if (ev.target.closest("[data-idel]")) { el.querySelector("#idel").innerHTML = `<div class="confirm">Delete this record?<button class="btn danger small" data-idelyes>Delete</button><button class="btn small" data-idelno>Keep</button></div>`; return; }
      if (ev.target.closest("[data-idelno]")) { redraw(); return; }
      if (ev.target.closest("[data-idelyes]")) { S.meta.ious = S.meta.ious.filter(x => x !== e); markDirty("meta"); closeSheet(); render(); toast("Record deleted"); }
    });
  });
}

/* work time: what spending costs in hours or days of work */
function workCfg() {
  const w = S.meta.work ||= {};
  if (!["auto", "hourly", "daily"].includes(w.mode)) w.mode = "auto";
  if (!(w.hpd > 0)) w.hpd = 8; if (!(w.dpm > 0)) w.dpm = 22;
  if (w.budget === undefined) w.budget = true; if (w.tx === undefined) w.tx = false;
  return w;
}
function lastSalary() {
  const salIds = new Set((S.meta.incomeCats || []).filter(c => /salary|wage|বেতন/i.test(c.name)).map(c => c.id));
  const order = []; for (let i = 1; i <= 12; i++) order.push(addM(CUR, -i)); order.push(CUR);
  const sum = (m, test) => (S.tx[m] || []).reduce((a, t) => (t.xfer || t.amount <= 0 || t.payee === "Starting balance" || isAdj(t) || !test(t)) ? a : a + t.amount, 0);
  for (const m of order) { const v = sum(m, t => salIds.has(t.cat)); if (v > 0) return { m, amt: v, kind: "salary" }; }
  for (const m of order) { const v = sum(m, t => isIncome(t.cat)); if (v > 0) return { m, amt: v, kind: "income" }; }
  return null;
}
function hourRate() {
  const w = workCfg();
  if (w.mode === "hourly" && w.rate > 0) return { r: w.rate, src: "hourly" };
  if (w.mode === "daily" && w.rate > 0) return { r: w.rate / w.hpd, src: "daily" };
  const s = lastSalary(); if (!s) return null;
  return { r: s.amt / (w.dpm * w.hpd), src: "auto", s };
}
function rateSrc(R) {
  const w = workCfg();
  if (R.src === "hourly") return "From the hourly income you entered";
  if (R.src === "daily") return `From ${fmt(w.rate)} a day ÷ ${w.hpd} hours`;
  return `From ${mLabel(R.s.m)} ${R.s.kind === "salary" ? "salary" : "income"} ${fmt(R.s.amt)} ÷ ${w.dpm} days ÷ ${w.hpd} hrs${w.mode !== "auto" ? " (no " + w.mode + " income entered yet)" : ""}`;
}
function workTime(c, R) {
  if (!R || !(R.r > 0) || !(c > 0)) return "";
  const w = workCfg(), h = c / R.r;
  if (h < 1) { const mi = Math.max(1, Math.round(h * 60)); return mi + " min"; }
  if (h < w.hpd) { const v = Math.round(h * 10) / 10; return v + (v === 1 ? " hr" : " hrs"); }
  const d = h / w.hpd, v = d < 10 ? Math.round(d * 10) / 10 : Math.round(d);
  return v + (v === 1 ? " workday" : " workdays");
}

function spendByCat(m) {
  const I = index(), a = I.act[m] || {}; const out = [];
  for (const g of S.meta.groups) for (const c of g.cats) { const v = -(a[c.id] || 0); if (v > 0) out.push({ c, g, v }); }
  return out.sort((x, y) => y.v - x.v);
}
function monthFlow(m) {
  const I = index(); let inc = 0, sp = 0;
  for (const list of Object.values(S.tx)) for (const t of list) {
    if (ymOf(t.date) !== m || !I.onB.has(t.acct) || (t.xfer && I.onB.has(t.xfer))) continue;
    if (t.payee === "Starting balance") continue;
    if (isIncome(t.cat) || (!t.cat && t.amount > 0)) inc += t.amount; else sp += t.amount;
  }
  return { inc, sp: -sp };
}
function netWorthAt(m) { const end = m + "-31"; let s = 0; for (const t of allTx()) if (t.date <= end) s += t.amount; return s; }
function niceMax(v) { if (v <= 0) return 100; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= v) return k * p; return 10 * p; }
const short = c => { const v = Math.abs(c) / 100; const s = v >= 1e7 ? (v / 1e7).toFixed(1) + "Cr" : v >= 1e5 ? (v / 1e5).toFixed(1) + "L" : v >= 1e3 ? (v / 1e3).toFixed(0) + "k" : v.toFixed(0); return (c < 0 ? "−" : "") + s.replace(".0", ""); };
function vReports() {
  const seg = `<div class="seg" role="tablist">${[["spending", "Spending"], ["flow", "Cash flow"], ["networth", "Net worth"]].map(([k, l]) => `<button role="tab" data-rep="${k}" class="${ui.report === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
  let body = "";
  if (ui.report === "spending") {
    const rows = spendByCat(ui.month), tot = rows.reduce((s, r) => s + r.v, 0);
    const prev = spendByCat(addM(ui.month, -1)).reduce((s, r) => s + r.v, 0);
    const max = rows[0]?.v || 1;
    const groupTot = {}; rows.forEach(r => groupTot[r.g.name] = (groupTot[r.g.name] || 0) + r.v);
    body = `<div class="card"><h3>Spent in ${mLabel(ui.month)}</h3><div class="big num" style="font-family:var(--f-display);font-weight:800;font-size:28px">${fmt(tot)}</div>
      <p class="cap">${prev ? (tot >= prev ? `${fmt(tot - prev)} more than ${mShort(addM(ui.month, -1))}` : `${fmt(prev - tot)} less than ${mShort(addM(ui.month, -1))}`) : "No spending last month to compare"}</p>
      ${rows.length ? `<div class="legend">${Object.entries(groupTot).map(([n, v]) => `<span>${esc(n)} <b class="num">${Math.round(v / tot * 100)}%</b></span>`).join("")}</div>` : ""}
      ${rows.map(r => `<div class="hbar"><span>${esc(lbl(r.c))}</span><span class="num">${fmt(r.v)}</span><span class="track"><i style="width:${Math.max(2, r.v / max * 100)}%"></i></span></div>`).join("") || `<div class="empty">No spending this month.</div>`}</div>`;
  } else if (ui.report === "flow") {
    const ms = Array.from({ length: 6 }, (_, i) => addM(ui.month, i - 5)), d = ms.map(m => ({ m, ...monthFlow(m) }));
    const mx = niceMax(Math.max(...d.map(x => Math.max(x.inc, x.sp))));
    const W = 340, H = 190, L = 34, Bt = 22, T = 10, cw = (W - L - 6) / 6, y = v => T + (H - T - Bt) * (1 - v / mx);
    let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and spending, last six months">`;
    for (let i = 0; i <= 4; i++) { const v = mx * i / 4; svg += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 5}" y="${y(v) + 3}" text-anchor="end">${short(v)}</text>`; }
    d.forEach((x, i) => { const x0 = L + i * cw + cw * 0.18, bw = cw * 0.3;
      svg += `<rect x="${x0}" y="${y(x.inc)}" width="${bw}" height="${Math.max(0, y(0) - y(x.inc))}" rx="3" fill="var(--accent)"/><rect x="${x0 + bw + 2}" y="${y(x.sp)}" width="${bw}" height="${Math.max(0, y(0) - y(x.sp))}" rx="3" fill="var(--hi)"/>`;
      svg += `<text x="${L + i * cw + cw / 2}" y="${H - 6}" text-anchor="middle" style="${x.m === ui.month ? "fill:var(--ink);font-weight:600" : ""}">${mShort(x.m)}</text>`; });
    svg += `</svg>`;
    const cur = d[5];
    const src = {}; const I2 = index();
    for (const t of allTx()) { if (ymOf(t.date) !== ui.month || !I2.onB.has(t.acct) || t.xfer || t.amount <= 0 || t.payee === "Starting balance" || !(isIncome(t.cat) || !t.cat)) continue; const k = incById(t.cat) ? t.cat : "other"; src[k] = (src[k] || 0) + t.amount; }
    const srcRows = Object.entries(src).sort((a, b) => b[1] - a[1]), srcMax = srcRows[0]?.[1] || 1;
    const srcCard = `<div class="card" style="margin-top:12px"><h3>Income by source</h3><p class="cap">${mLabel(ui.month)}</p>${srcRows.map(([k, v]) => `<div class="hbar"><span>${esc(k === "other" ? "Uncategorized income" : lbl(incById(k)))}</span><span class="num">${fmt(v)}</span><span class="track"><i style="width:${Math.max(2, v / srcMax * 100)}%;background:var(--good)"></i></span></div>`).join("") || `<div class="empty">No income recorded this month.</div>`}</div>`;
    body = `<div class="card"><h3>Income vs spending</h3><p class="cap">Budget accounts, transfers excluded</p>${svg}
      <div class="legend"><span><i style="background:var(--accent)"></i>Income</span><span><i style="background:var(--hi)"></i>Spending</span></div></div>
      <div class="rep-grid"><div class="list" style="margin-top:12px">${d.slice().reverse().map(x => `<div class="li"><span class="main"><span class="t" style="display:block">${mLabel(x.m)}</span><span class="s" style="display:block">In ${fmt(x.inc)} · Out ${fmt(x.sp)}</span></span><span class="amt num ${x.inc - x.sp < 0 ? "neg" : "in"}">${fmt(x.inc - x.sp, { sign: true })}</span></div>`).join("")}</div>
      ${srcCard}</div>
      <p class="small muted" style="margin:10px 4px">Savings rate for ${mShort(cur.m)}: <b class="num">${cur.inc > 0 ? Math.round((cur.inc - cur.sp) / cur.inc * 100) + "%" : "—"}</b></p>`;
  } else {
    const ms = Array.from({ length: 12 }, (_, i) => addM(ui.month, i - 11)), d = ms.map(m => ({ m, v: netWorthAt(m) }));
    const lo = Math.min(0, ...d.map(x => x.v)), hi = niceMax(Math.max(...d.map(x => x.v)));
    const W = 340, H = 190, L = 40, Bt = 22, T = 12, cw = (W - L - 10) / 11, y = v => T + (H - T - Bt) * (1 - (v - lo) / (hi - lo || 1)), x = i => L + i * cw;
    let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net worth, last twelve months">`;
    for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; svg += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 5}" y="${y(v) + 3}" text-anchor="end">${short(v)}</text>`; }
    const pts = d.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
    svg += `<polygon points="${x(0)},${y(lo)} ${pts} ${x(11)},${y(lo)}" fill="var(--accent)" opacity=".14"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
    svg += `<circle cx="${x(11)}" cy="${y(d[11].v)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
    d.forEach((p, i) => { if (i % 2 === 1 || i === 11) svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${mShort(p.m)}</text>`; });
    svg += `</svg>`;
    const { b } = balances(); let assets = 0, debts = 0; S.meta.accounts.forEach(a => { const v = b[a.id] || 0; if (v >= 0) assets += v; else debts += v; });
    const ch = d[11].v - d[10].v;
    body = `<div class="card"><h3>Net worth</h3><div class="num" style="font-family:var(--f-display);font-weight:800;font-size:28px">${fmt(d[11].v)}</div>

      <div class="chips"><div class="chip">Assets today<span class="num">${fmt(assets)}</span></div><div class="chip">Debts today<span class="num">${fmt(debts)}</span></div></div>`;
  }
  return seg + `<div style="margin-top:12px">${body}</div>`;
}

  <div class="sorthead"><h2 class="sec">Accounts</h2>${S.meta.accounts.length > 1 ? `<button class="ib" data-act="sortaccts" title="Sort accounts A–Z">Sort A–Z</button>` : ""}</div><p class="small muted" style="margin:0 4px 8px">Use ↑ ↓ to change the order they appear in.</p><div class="list">${accts || `<div class="empty">No accounts yet.</div>`}</div>
  <h2 class="sec" id="backup">Backup &amp; Excel</h2><div class="card" style="display:grid;gap:10px">
    <h3 style="margin:0;font-size:15px;font-family:var(--f-display)">Excel</h3>
    <p class="small muted">Download everything as an Excel workbook: transactions, accounts, budget, and lent &amp; owed. Import it later to restore, or import a bank statement to add its transactions.</p>
    <div class="toolbar" style="margin:0"><button class="btn pri" data-act="xlsxout">Export to Excel</button><button class="btn" data-act="xlsxin">Import from Excel</button></div>
    ${bkHtml()}
    <h3 style="margin:6px 0 0;font-size:15px;font-family:var(--f-display)">Backup file</h3>
    <p class="small muted">Export everything as JSON. Import replaces the current budget.</p>
    <div class="toolbar" style="margin:0"><button class="btn" data-act="export">Export</button><button class="btn" data-act="import">Import</button></div>
    <div id="eraseBox"><button class="btn danger small" data-act="erase">Erase all data</button></div>
  </div>
  <h2 class="sec">How it works</h2><div class="card" style="display:grid;gap:8px;font-size:14px">
    <p><b>Give every taka a job.</b> Income lands in Ready to Assign. Assign it to categories until it reaches zero.</p>
    <p><b>Roll with the punches.</b> Overspent? Move money from another category. Leftover money rolls into next month.</p>
    <p><b>Targets.</b> Set a monthly amount or a save-by date. "Fund targets" assigns exactly what's needed.</p>
    <p><b>Work time.</b> Turns spending into hours or days of work, from your hourly or daily income or last month's salary.</p>
    <p><b>Lent &amp; Owed.</b> Under Accounts, track money you lent or borrowed, due dates and repayments. Link an account to move the money for real.</p>
    <p><b>Reconcile.</b> Mark transactions cleared, then match your account to the bank's balance.</p>
    <p><b>Excel &amp; backups.</b> Export to Excel any time, or import a bank statement. Signed in, your budget is backed up to your account every day.</p>
  </div>`;
}

/* ---------- sheets ---------- */
let sheetRefresh = null;
function openSheet(html, mount) {
  const r = $("#sheetRoot");
  r.innerHTML = `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  r.hidden = false; document.documentElement.classList.add("locked"); if (mount) mount(r.querySelector(".sheet"));
  const f = r.querySelector("[autofocus]"); if (f) setTimeout(() => f.focus(), 60);
}
function closeSheet() { const r = $("#sheetRoot"); r.hidden = true; r.innerHTML = ""; sheetRefresh = null; document.documentElement.classList.remove("locked"); }
const shead = t => `<div class="shead"><h2>${t}</h2><button class="x" data-close aria-label="Close">✕</button></div>`;
const acctOpts = (sel, filt = () => true) => S.meta.accounts.filter(a => !a.closed || a.id === sel).filter(filt).map(a => `<option value="${a.id}" ${a.id === sel ? "selected" : ""}>${esc(a.name)}</option>`).join("");
function catOpts(sel, withIncome) {
  let s = `<option value="">Uncategorized</option>`;
  if (withIncome) s += `<optgroup label="Income → Ready to Assign">${(S.meta.incomeCats || []).map(c => `<option value="${c.id}" ${c.id === sel ? "selected" : ""}>${esc(lbl(c))}</option>`).join("")}<option value="income" ${sel === "income" ? "selected" : ""}>Income (no category)</option></optgroup>`;
  for (const g of S.meta.groups) { const cs = g.cats.filter(c => !c.hidden || c.id === sel); if (cs.length) s += `<optgroup label="${esc(lbl(g))}">${cs.map(c => `<option value="${c.id}" ${c.id === sel ? "selected" : ""}>${esc(lbl(c))}</option>`).join("")}</optgroup>`; }
  return s;
}

function txSheet(id, preset = {}) {
  const ex = id ? findTx(id)?.t : null;
  let kind = ex ? (ex.xfer ? "xfer" : ex.amount > 0 ? "in" : "out") : (preset.kind || "out");
  let ik = preset.ik || "lent";   /* lend/borrow sub-type: lent | borrowed | repay */
  let from = ex?.acct, to = ex?.xfer;
  if (ex?.xfer && ex.amount > 0) { from = ex.xfer; to = ex.acct; }
  const firstAcct = (S.meta.accounts.find(a => a.onBudget && !a.closed) || S.meta.accounts[0])?.id;
  if (!S.meta.accounts.length) { toast("Add an account first."); acctSheet(); return; }
  const payees = [...new Set(allTx().filter(t => !t.xfer && t.payee).map(t => t.payee))].slice(0, 200);
  const pair = ex?.xid ? allTx().find(t => t.xid === ex.xid && t.id !== ex.id) : null;
  const xcat = ex?.xfer ? (ex.cat || pair?.cat || "") : "";
  const iouFields = () => {
    const ious = S.meta.ious ||= [];
    const open = ious.filter(iouOpen).sort((a, b) => a.person.localeCompare(b.person));
    const names = [...new Set(ious.map(x => x.person.trim()))];
    const acctSel = (label, sel) => `<label class="field">${label}<select id="t-acct"><option value="">Don't record in an account</option>${acctOpts(sel || null, a => !a.helper)}</select></label>`;
    const sub = `<div class="seg">${[["lent", "I lent"], ["borrowed", "I borrowed"], ["repay", "Repayment"]].map(([k, l]) => `<button data-ik="${k}" class="${ik === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
    if (ik === "repay") {
      if (!open.length) return sub + `<p class="small muted">Nothing outstanding. Record money you lend or borrow first.</p>`;
      const first = open.find(x => x.id === preset.iou) || open[0];
      return sub + `<label class="field">Who is the repayment with?<select id="t-iou">${open.map(e => `<option value="${e.id}" ${e === first ? "selected" : ""}>${esc(e.person)} · ${e.kind === "lent" ? "owes you" : "you owe"} ${fmt(iouLeft(e))}${e.note ? " · " + esc(e.note) : ""}</option>`).join("")}</select></label>
        <div class="quick" id="t-iouq"></div>
        ${acctSel("Received into / paid from", first.acct)}
        <label class="field">Date<input id="t-date" type="date" value="${TODAY}"></label>`;
    }
    return sub + `<label class="field">${ik === "lent" ? "Lent to" : "Borrowed from"}<input id="t-person" list="iou-people2" placeholder="Name" autocomplete="off" value="${esc(preset.person || "")}"></label>
      <datalist id="iou-people2">${names.map(n => `<option value="${esc(n)}"></option>`).join("")}</datalist>
      <label class="field">What for<input id="t-note" placeholder="Optional, e.g. rent share"></label>
      ${acctSel(ik === "lent" ? "Paid from" : "Received into", preset.acct)}
      <div class="grid2"><label class="field">Date<input id="t-date" type="date" value="${TODAY}"></label><label class="field">Due by<input id="t-due" type="date"></label></div>
      <p class="small muted">Picking an account moves the money there too, so its balance stays right. See and change these under Accounts → Lent &amp; Owed.</p>`;
  };
  const draw = () => {
    const isX = kind === "xfer";
    return `${shead(ex ? "Edit transaction" : "New transaction")}
    <div class="seg">${[["out", "Expense"], ["in", "Income"], ["xfer", "Transfer"], ...(ex ? [] : [["iou", "Lend / Borrow"]])].map(([k, l]) => `<button data-kind="${k}" class="${kind === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <label class="field">Amount<input id="t-amt" class="amount-in num" inputmode="decimal" placeholder="0" value="${ex ? plain(Math.abs(ex.amount)) : ""}" autofocus aria-label="Amount"></label>
    ${kind === "iou" ? iouFields() : isX ? `<div class="grid2"><label class="field">From<select id="t-from">${acctOpts(from || firstAcct)}</select></label><label class="field">To<select id="t-to">${acctOpts(to || S.meta.accounts.find(a => a.id !== (from || firstAcct))?.id)}</select></label></div>
      <label class="field" id="t-xcatwrap">Category (only when money leaves or joins the budget)<select id="t-cat">${catOpts(xcat, false)}</select></label>`
    : `<label class="field">Payee<input id="t-payee" list="payees" value="${esc(ex?.payee || "")}" placeholder="${kind === "in" ? "Employer, client…" : "Shop, person, company"}" autocomplete="off"></label>
      <datalist id="payees">${payees.map(p => `<option value="${esc(p)}"></option>`).join("")}</datalist>
      <label class="field">Category<select id="t-cat">${catOpts(ex ? ex.cat : (kind === "in" ? (S.meta.incomeCats?.[0]?.id || "income") : ""), true)}</select></label>
      <label class="field">Account<select id="t-acct">${acctOpts(ex?.acct || preset.acct || firstAcct)}</select></label>`}
    ${kind === "iou" ? "" : `<div class="grid2"><label class="field">Date<input id="t-date" type="date" value="${ex?.date || TODAY}"></label><label class="field">Memo<input id="t-memo" value="${esc(ex?.memo || "")}" placeholder="Optional"></label></div>`}
    <label class="toggle" ${kind === "iou" ? "hidden" : ""}>Cleared with bank<input id="t-clr" type="checkbox" ${(ex ? ex.cleared : true) ? "checked" : ""}></label>
    ${ex?.rec ? `<p class="small muted">🔒 Reconciled. Editing it will change your reconciled balance.</p>` : ""}
    <p class="small muted">Tip: type sums like 1200+350.</p>
    <button class="btn pri block" data-save>${ex ? "Save changes" : kind === "iou" ? (ik === "repay" ? "Record repayment" : ik === "lent" ? "Save money lent" : "Save money borrowed") : "Add transaction"}</button>
    ${ex ? `<div id="delbox"><button class="btn danger block" data-del>Delete transaction</button></div>` : ""}`;
  };
  const mount = el => {
    el.addEventListener("click", e => {
      const k = e.target.closest("[data-kind]"), ib = e.target.closest("[data-ik]");
      if (k || ib) {
        const keep = { amt: el.querySelector("#t-amt").value, date: el.querySelector("#t-date")?.value, memo: el.querySelector("#t-memo")?.value, person: el.querySelector("#t-person")?.value, note: el.querySelector("#t-note")?.value };
        if (k) kind = k.dataset.kind; else ik = ib.dataset.ik;
        el.innerHTML = '<div class="grab"></div>' + draw();
        const setv = (sel, v) => { const x = el.querySelector(sel); if (x && v != null) x.value = v; };
        setv("#t-amt", keep.amt); setv("#t-date", keep.date); setv("#t-memo", keep.memo); setv("#t-person", keep.person); setv("#t-note", keep.note);
        wire(el); return;
      }
      if (k) { const keep = { amt: el.querySelector("#t-amt").value, date: el.querySelector("#t-date").value, memo: el.querySelector("#t-memo").value }; kind = k.dataset.kind; el.innerHTML = '<div class="grab"></div>' + draw(); el.querySelector("#t-amt").value = keep.amt; el.querySelector("#t-date").value = keep.date; el.querySelector("#t-memo").value = keep.memo; wire(el); return; }
      if (e.target.closest("[data-del]")) { el.querySelector("#delbox").innerHTML = `<div class="confirm">Delete for good?<button class="btn danger small" data-delyes>Delete</button><button class="btn small" data-delno>Keep</button></div>`; return; }
      if (e.target.closest("[data-delno]")) { el.querySelector("#delbox").innerHTML = `<button class="btn danger block" data-del>Delete transaction</button>`; return; }
      if (e.target.closest("[data-delyes]")) {
        const keys = []; if (ex.xid) allTx().filter(t => t.xid === ex.xid).forEach(t => keys.push(removeTx(t.id))); else keys.push(removeTx(ex.id));
        markDirty(...keys); closeSheet(); render(); toast("Transaction deleted"); return;
      }
      if (e.target.closest("[data-save]")) save(el);
    });
    wire(el);
  };
  const wire = el => {
    const p = el.querySelector("#t-payee"), c = el.querySelector("#t-cat");
    if (p && c) p.addEventListener("change", () => { const m = S.meta.payees[p.value.trim().toLowerCase()]; if (m && (catById(m) || incById(m)) && (!c.value || isIncome(c.value) === isIncome(m))) c.value = m; });
    const f = el.querySelector("#t-from"), t = el.querySelector("#t-to"), w = el.querySelector("#t-xcatwrap");
    const upd = () => { if (!f) return; const a = acctById(f.value), b = acctById(t.value); w.hidden = !(a && b && a.onBudget !== b.onBudget); };
    if (f) { f.addEventListener("change", upd); t.addEventListener("change", upd); upd(); }
    const io = el.querySelector("#t-iou");
    if (io) {
      const sync = () => { const r = S.meta.ious.find(x => x.id === io.value); if (!r) return; const left = iouLeft(r);
        el.querySelector("#t-iouq").innerHTML = `<button data-pq="${left}">Full ${fmt(left)}</button>${left >= 200 ? `<button data-pq="${Math.round(left / 200) * 100}">Half ${fmt(Math.round(left / 200) * 100)}</button>` : ""}`;
        if (r.acct && acctById(r.acct)) el.querySelector("#t-acct").value = r.acct; };
      io.addEventListener("change", sync); sync();
      el.querySelector("#t-iouq").addEventListener("click", ev => { const q = ev.target.closest("[data-pq]"); if (q) el.querySelector("#t-amt").value = plain(+q.dataset.pq); });
    }
  };
  const save = el => {
    const amt = parseAmt(el.querySelector("#t-amt").value);
    if (!amt || amt <= 0) { toast("Enter an amount above zero."); el.querySelector("#t-amt").focus(); return; }
    if (kind === "iou") {
      const date = el.querySelector("#t-date")?.value || TODAY, acct = el.querySelector("#t-acct")?.value || null;
      let keys, msg;
      if (ik === "repay") {
        const r = (S.meta.ious || []).find(x => x.id === el.querySelector("#t-iou")?.value);
        if (!r) { toast("Nothing outstanding to repay."); return; }
        const left = iouLeft(r); if (amt > left) { toast(`That's more than the ${fmt(left)} remaining.`); return; }
        keys = iouRepay(r, amt, date, acct);
        msg = iouLeft(r) <= 0 ? `${r.person} is fully settled` : `Recorded ${fmt(amt)} ${r.kind === "lent" ? "from" : "to"} ${r.person}`;
      } else {
        const person = el.querySelector("#t-person").value.trim();
        if (!person) { toast("Add the person's name."); el.querySelector("#t-person").focus(); return; }
        keys = iouCreate(ik, person, amt, date, el.querySelector("#t-due").value || null, el.querySelector("#t-note").value.trim(), acct);
        msg = ik === "lent" ? `Lent ${fmt(amt)} to ${person}` : `Borrowed ${fmt(amt)} from ${person}`;
      }
      markDirty(...new Set(keys)); closeSheet(); render(); toast(msg); return;
    }
    const date = el.querySelector("#t-date").value || TODAY, memo = el.querySelector("#t-memo").value.trim(), cleared = el.querySelector("#t-clr").checked;
    if (kind === "xfer" && el.querySelector("#t-from").value === el.querySelector("#t-to").value) { toast("Pick two different accounts."); return; }
    const keys = [];
    const rec = ex?.rec || false;
    if (ex) { if (ex.xid) allTx().filter(t => t.xid === ex.xid).forEach(t => keys.push(removeTx(t.id))); else keys.push(removeTx(ex.id)); }
    if (kind === "xfer") {
      const fa = el.querySelector("#t-from").value, ta = el.querySelector("#t-to").value;
      const A = acctById(fa), B = acctById(ta), mixed = A.onBudget !== B.onBudget, cat = mixed ? (el.querySelector("#t-cat").value || null) : null;
      const xid = rid();
      keys.push(putTx({ id: rid(), date, acct: fa, payee: "Transfer: " + B.name, cat: A.onBudget && mixed ? cat : null, amount: -amt, memo, cleared, xfer: ta, xid }));
      keys.push(putTx({ id: rid(), date, acct: ta, payee: "Transfer: " + A.name, cat: B.onBudget && mixed ? cat : null, amount: amt, memo, cleared, xfer: fa, xid }));
    } else {
      const payee = el.querySelector("#t-payee").value.trim(), cat = el.querySelector("#t-cat").value || null, acct = el.querySelector("#t-acct").value;
      keys.push(putTx({ id: ex?.id || rid(), date, acct, payee, cat, amount: kind === "out" ? -amt : amt, memo, cleared, rec: rec && cleared }));
      if (payee && cat && cat !== "income") { S.meta.payees[payee.toLowerCase()] = cat; keys.push("meta"); }
    }
    markDirty(...new Set(keys)); closeSheet(); render(); toast(ex ? "Saved" : "Transaction added");
  };
  openSheet(draw(), mount);
}

function catSheet(cid) {
  const draw = () => {
    const c = catById(cid); if (!c) { closeSheet(); return ""; }
    const m = ui.month, B = budget(m), r = B.rows[cid], n = need(c, r, m);
    const lastAsg = (S.meta.assigned[addM(m, -1)] || {})[cid] || 0;
    const I = index(); let avg = 0; for (let i = 1; i <= 3; i++) avg += -((I.act[addM(m, -i)] || {})[cid] || 0); avg = Math.max(0, Math.round(avg / 3 / 100) * 100);
    const acts = allTx().filter(t => t.cat === cid && ymOf(t.date) === m).sort((a, b) => a.date < b.date ? 1 : -1);
    const t = c.target || {};
    return `${shead(esc(lbl(c)))}
      <div class="kv"><div>Carried<span class="num">${fmt(r.carry)}</span></div><div>Assigned<span class="num">${fmt(r.assigned)}</span></div><div>Activity<span class="num">${fmt(r.activity)}</span></div><div>Available<span class="num" style="color:${r.available < 0 ? "var(--bad)" : "inherit"}">${fmt(r.available)}</span></div></div>
      ${(() => { const R = workCfg().budget ? hourRate() : null; return R && r.activity < 0 ? `<p class="small muted">⏱ Spending here in ${mLabel(m)} took <b>${workTime(-r.activity, R)}</b> of work.</p>` : ""; })()}
      <label class="field">Assigned in ${mLabel(m)}<input id="c-asg" class="num" inputmode="decimal" value="${plain(r.assigned)}"></label>
      <div class="quick">
        ${n && n.under > 0 ? `<button data-q="${r.assigned + n.under}">Fund target +${fmt(n.under)}</button>` : ""}
        ${r.available < 0 ? `<button data-q="${r.assigned - r.available}">Cover overspending +${fmt(-r.available)}</button>` : ""}
        ${lastAsg ? `<button data-q="${lastAsg}">Last month ${fmt(lastAsg)}</button>` : ""}
        ${avg ? `<button data-q="${avg}">3-mo avg spent ${fmt(avg)}</button>` : ""}
        <button data-q="0">Zero</button>
      </div>
      <button class="btn pri block" data-asg>Save assigned</button>
      <div class="card" style="display:grid;gap:10px;padding:14px"><h3 style="font-size:15px">Move money</h3>
        <div class="grid2"><label class="field">Amount<input id="mv-amt" class="num" inputmode="decimal" placeholder="0"></label>
        <label class="field">Direction<select id="mv-dir"><option value="in">Into ${esc(lbl(c))}</option><option value="out">Out of ${esc(lbl(c))}</option></select></label></div>
        <label class="field">Other side<select id="mv-other"><option value="rta">Ready to Assign (${fmt(B.rta)})</option>${S.meta.groups.map(g => `<optgroup label="${esc(lbl(g))}">${g.cats.filter(x => x.id !== cid && !x.hidden).map(x => `<option value="${x.id}">${esc(lbl(x))} (${fmt(B.rows[x.id]?.available || 0)})</option>`).join("")}</optgroup>`).join("")}</select></label>
        <button class="btn block" data-move>Move</button></div>
      <div class="card" style="display:grid;gap:10px;padding:14px"><h3 style="font-size:15px">Target</h3>
        <div class="seg">${[["", "None"], ["monthly", "Monthly"], ["by", "Save by date"]].map(([k, l]) => `<button data-tt="${k}" class="${(t.type || "") === k ? "on" : ""}">${l}</button>`).join("")}</div>
        <div id="tgt-f" ${t.type ? "" : "hidden"}><div class="grid2"><label class="field">Amount<input id="tg-amt" class="num" inputmode="decimal" value="${t.amount ? plain(t.amount) : ""}"></label>
        <label class="field" id="tg-dwrap" ${t.type === "by" ? "" : "hidden"}>By month<input id="tg-date" type="month" value="${t.date || addM(m, 6)}"></label></div></div>
        ${n ? `<p class="small muted">${n.kind === "monthly" ? `Needs ${fmt(n.goal)} each month.` : `${fmt(n.per)} a month for ${n.rem} month${n.rem > 1 ? "s" : ""} reaches ${fmt(n.goal)}.`}</p>` : ""}
        <button class="btn block" data-tsave>Save target</button></div>
      <h3 style="margin:0;font-size:15px;font-family:var(--f-display)">Activity in ${mLabel(m)}</h3>
      ${acts.length ? `<div class="list">${acts.map(t => `<button class="li" data-tx="${t.id}"><span class="main"><span class="t" style="display:block">${esc(t.payee || "No payee")}</span><span class="s" style="display:block">${dLabel(t.date)} · ${esc(acctById(t.acct)?.name || "")}</span></span><span class="amt num ${t.amount > 0 ? "in" : ""}">${fmt(t.amount, { sign: true })}</span></button>`).join("")}</div>` : `<p class="small muted">No transactions this month.</p>`}
      <button class="btn block" data-addhere>Add expense to ${esc(lbl(c))}</button>`;
  };
  let tt = catById(cid)?.target?.type || "";
  const setAsg = v => { const m = ui.month; (S.meta.assigned[m] ??= {}); if (v) S.meta.assigned[m][cid] = v; else delete S.meta.assigned[m][cid]; if (!Object.keys(S.meta.assigned[m]).length) delete S.meta.assigned[m]; };
  const mount = el => {
    el.addEventListener("click", e => {
      const q = e.target.closest("[data-q]"); if (q) { el.querySelector("#c-asg").value = plain(+q.dataset.q); return; }
      if (e.target.closest("[data-asg]")) { const v = parseAmt(el.querySelector("#c-asg").value); if (v == null) { toast("Enter an amount."); return; } setAsg(v); markDirty("meta"); render(); redraw(); toast("Assigned " + fmt(v)); return; }
      if (e.target.closest("[data-move]")) {
        const v = parseAmt(el.querySelector("#mv-amt").value); if (!v || v <= 0) { toast("Enter an amount to move."); return; }
        const dir = el.querySelector("#mv-dir").value, other = el.querySelector("#mv-other").value, m = ui.month;
        const a = S.meta.assigned[m] ??= {};
        const delta = dir === "in" ? v : -v;
        a[cid] = (a[cid] || 0) + delta;
        if (other !== "rta") a[other] = (a[other] || 0) - delta;
        markDirty("meta"); render(); redraw(); toast(`Moved ${fmt(v)}`); return;

async function saveFile(name, blob) {

  if (f && matchMedia("(pointer:coarse)").matches && navigator.canShare && navigator.canShare({ files: [f] })) {

function xlDate(v) {
  if (v instanceof Date && !isNaN(v)) return localISO(v);
  if (typeof v === "number" && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  const s = String(v ?? "").trim(); if (!s) return null;
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if (m) return m[1] + "-" + z2(m[2]) + "-" + z2(m[3]);
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})$/);
  if (m) {   /* day first (dd/mm/yyyy), unless that can't be right */
    let d = +m[1], mo = +m[2]; const y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
    if (mo > 12 && d <= 12) [d, mo] = [mo, d];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return y + "-" + z2(mo) + "-" + z2(d);
  }
  const t = Date.parse(s); return isNaN(t) ? null : localISO(new Date(t));
}
function xlAmt(v) { if (v === "" || v == null) return null; if (typeof v === "number") return Math.round(v * 100); return parseAmt(String(v).replace(/^\((.*)\)$/, "-$1").replace(/[A-Za-z]/g, "")); }

/* reads a sheet of transactions (ours, or a bank statement with similar columns) into a plan; nothing changes until it's applied */
function planImport(X, ws, fallbackAcct) {
  const rows = X.utils.sheet_to_json(ws, { raw: true, defval: "" });
  if (!rows.length) return { error: "That sheet has no rows." };
  const keys = Object.keys(rows[0]);
  const col = (...names) => keys.find(k => names.includes(k.trim().toLowerCase()));
  const C = {
    date: col("date", "transaction date", "txn date", "value date", "posting date"),
    acct: col("account", "account name"),
    payee: col("payee", "description", "details", "narration", "particulars", "merchant"),
    group: col("category group", "group"),
    cat: col("category"),
    memo: col("memo", "note", "notes", "remarks", "reference"),
    amt: col("amount", "amount (৳)", "amount (bdt)"),
    out: col("outflow", "debit", "withdrawal", "withdrawals", "money out", "paid out", "expense"),
    inn: col("inflow", "credit", "deposit", "deposits", "money in", "paid in", "income"),
    clr: col("cleared"),
    xfer: col("transfer account", "transfer"),
  };
  if (!C.date) return { error: "Couldn't find a Date column." };
  if (!C.amt && !C.out && !C.inn) return { error: "Couldn't find an Amount column (or Inflow / Outflow)." };
  const out = [], bad = [];
  rows.forEach((r, i) => {

    case "toggletxwork": { const W = workCfg(); W.tx = !W.tx; markDirty("meta"); render(); toast(W.tx ? "Showing work time" : "Work time hidden"); break; }
    case "tfclear": ui.tf = { acct: "", month: "", type: "" }; ui.q = ""; ui.limit = 150; render(); break;
    case "acctback": ui.acct = null; ui.q = ""; render(); break;
    case "addacct": acctSheet(); break;
    case "reconcile": reconcileSheet(ui.acct); break;
    case "more": ui.limit += 150; render(); break;
    case "sortgrps": S.meta.groups.sort(byName); markDirty("meta"); render(); toast("Groups sorted A–Z"); break;
    case "sortaccts": S.meta.accounts.sort(byName); markDirty("meta"); render(); toast("Accounts sorted A–Z"); break;
    case "addgrp": { const i = $("#newgrp"); const n = i.value.trim(); if (!n) { i.focus(); break; } S.meta.groups.push({ id: rid(), name: n, cats: [] }); markDirty("meta"); render(); toast("Group added"); break; }
    case "export": exportSheet(); break;
    case "xlsxout": exportXLSX(); break;
    case "xlsxin": xlsxImportSheet(); break;
    case "bknow": {
      if (!bkReady()) break;
      if (!navigator.onLine) { toast("You're offline. Back up when you're connected."); break; }
      const b = el.closest("button"); b.disabled = true; b.textContent = "Backing up…";
      cloudBackup("manual").then(() => { toast("Backup saved to your account"); loadBackups(); }, e => { bk.err = bkErr(e); toast(bk.err === "rules" ? "Backups aren't allowed by the Firebase rules yet." : "Couldn't save the backup. Check your connection."); render(); });
      break;
    }
    case "import": importSheet(); break;
    case "erase": $("#eraseBox").innerHTML = `<div class="confirm">Erase every account, transaction and category?<button class="btn danger small" data-act="eraseyes">Erase</button><button class="btn small" data-act="eraseno">Cancel</button></div>`; break;
    case "eraseno": render(); break;
    case "eraseyes": backupBeforeReplace("Before erase").then(() => { replaceAll(blank()); toast("All data erased"); }); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#sheetRoot").hidden) { closeSheet(); return; }
  /* desktop shortcuts, only when not typing and no sheet is open */
  if (e.ctrlKey || e.metaKey || e.altKey || !$("#sheetRoot").hidden || !S) return;
  const tg = e.target; if (tg.closest && tg.closest("input,select,textarea,[contenteditable]")) return;
  if (e.key === "n" || e.key === "N") { e.preventDefault(); $("[data-act=newtx]")?.click(); }
  else if (e.key === "/") { const q = $("#q"); if (q) { e.preventDefault(); q.focus(); } }
  else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && (ui.tab === "budget" || ui.tab === "reports")) { e.preventDefault(); ui.month = addM(ui.month, e.key === "ArrowLeft" ? -1 : 1); render(); }
  else if (e.key >= "1" && e.key <= "5") { ui.tab = ["budget", "transactions", "accounts", "reports", "more"][+e.key - 1]; ui.acct = null; ui.q = ""; ui.limit = 150; render(); scrollTo(0, 0); }
});
document.addEventListener("input", e => { if (e.target.id === "q") { ui.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); } });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "tf-acct" || t.id === "tf-month" || t.id === "tf-type") { ui.tf[t.id.slice(3)] = t.value; ui.limit = 150; render(); return; }
  if (t.id === "cur") { const c = CURRENCIES.find(x => x[0] === t.value); S.meta.currency = c[0]; S.meta.locale = c[1]; markDirty("meta"); render(); return; }
  if (t.dataset.gname) { const g = S.meta.groups.find(x => x.id === t.dataset.gname); const v = t.value.trim(); if (v) { g.name = v; markDirty("meta"); } else t.value = g.name; return; }
  if (t.dataset.cname) { const c = catById(t.dataset.cname); const v = t.value.trim(); if (v) { c.name = v; markDirty("meta"); } else t.value = c.name; return; }
  if (t.dataset.aname) { const a = acctById(t.dataset.aname); const v = t.value.trim(); if (v) { a.name = v; markDirty("meta"); } else t.value = a.name; return; }
  if (t.id === "work-amt") { const v = parseAmt(t.value); workCfg().rate = v && v > 0 ? v : 0; markDirty("meta"); render(); return; }
  if (t.id === "work-hpd") { const v = parseFloat(t.value); workCfg().hpd = v > 0 && v <= 24 ? Math.round(v * 10) / 10 : 8; markDirty("meta"); render(); return; }
  if (t.id === "work-dpm") { const v = parseInt(t.value, 10); workCfg().dpm = v > 0 && v <= 31 ? v : 22; markDirty("meta"); render(); return; }
  if (t.id === "work-budget") { workCfg().budget = t.checked; markDirty("meta"); render(); return; }
  if (t.id === "work-tx") { workCfg().tx = t.checked; markDirty("meta"); render(); return; }
  if (t.id === "adj-toggle") { S.meta.showAdj = t.checked; markDirty("meta"); render(); toast(t.checked ? "Showing balance corrections" : "Balance corrections hidden"); return; }
  if (t.id === "emoji-toggle") { S.meta.showEmoji = t.checked; markDirty("meta"); render(); toast(t.checked ? "Emojis on" : "Emojis off"); return; }
  if (t.dataset.iname) { const c = incById(t.dataset.iname); const v = t.value.trim(); if (v) { c.name = v; markDirty("meta"); } else t.value = c.name; return; }
  if (t.dataset.newinc) { const v = t.value.trim(); if (!v) return; S.meta.incomeCats.push({ id: "inc-" + rid(), name: v, emoji: "" }); markDirty("meta"); render(); toast("Income category added"); return; }
  if (t.dataset.newcat) { const v = t.value.trim(); if (!v) return; S.meta.groups.find(g => g.id === t.dataset.newcat).cats.push({ id: rid(), name: v, target: null, hidden: false }); markDirty("meta"); render(); toast("Category added"); }
});

/* ---------- boot ---------- */
S = example(); mode = "example"; render();
connect();

/* app shortcut "Add transaction" (?new=tx): open the sheet once the real budget has loaded */
let wantNew = new URLSearchParams(location.search).get("new") === "tx";
if (wantNew) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
(function openWhenReady(tries) {
  if (!wantNew) return;
  const ready = store === "local" ? !AUTH || authKnown : store !== "pending" && gotFirst;
  if (ready && $("#sheetRoot").hidden) { wantNew = false; txSheet(null); return; }
  if (tries < 50) setTimeout(() => openWhenReady(tries + 1), 200);
})(0);

/* phones suspend backgrounded apps: save straight away instead of waiting for the debounce */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { if (dirty.size && store !== "pending") { clearTimeout(flushTimer); flush(); } return; }
  /* an app left open overnight still thinks it's yesterday; reload when idle so Today and the month are right */
  if (localISO(new Date()) !== TODAY && !dirty.size && !flushing && $("#sheetRoot").hidden) { location.reload(); return; }
  autoBackup();
});
addEventListener("pagehide", () => { if (dirty.size && store === "local") lsSet("et-data", JSON.stringify(S)); });
addEventListener("online", renderTop); addEventListener("offline", renderTop);

/* installable web app: cache the app so it opens offline (hosted site only) */
if ("serviceWorker" in navigator && !window.claude && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
})();
</script>
